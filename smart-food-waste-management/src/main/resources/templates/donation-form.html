<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Post Donation | FoodBridge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="container py-4"><form class="form-card" th:action="@{/restaurant/donations}" method="post" enctype="multipart/form-data"><h1 class="h3 fw-bold">Post a food donation</h1><p class="text-secondary">Add accurate food and expiry details so an NGO can arrange safe pickup.</p><div class="row g-3"><div class="col-md-6"><label class="form-label">Food name *</label><input class="form-control" name="foodName" required maxlength="120"></div><div class="col-md-6"><label class="form-label">Food type *</label><select class="form-select" name="foodType" required><option th:each="t : ${foodTypes}" th:value="${t}" th:text="${t}"></option></select></div><div class="col-md-4"><label class="form-label">Quantity *</label><input class="form-control" type="number" name="quantity" min="0.1" step="0.1" required></div><div class="col-md-4"><label class="form-label">Unit *</label><select class="form-select" name="unit"><option>servings</option><option>kg</option><option>boxes</option><option>packets</option><option>litres</option></select></div><div class="col-md-4"><label class="form-label">Expiry date & time *</label><input class="form-control" type="datetime-local" name="expiresAt" id="expiresAt" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3" maxlength="1200" placeholder="Preparation time, allergens, storage instructions..."></textarea></div><div class="col-12"><label class="form-label">Pickup address *</label><input class="form-control" name="pickupAddress" required></div><div class="col-md-6"><label class="form-label">Food photo (optional, max 5 MB)</label><input class="form-control" name="photo" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="col-12"><input type="hidden" name="latitude" id="latitude"><input type="hidden" name="longitude" id="longitude"><button type="button" class="btn btn-outline-success" onclick="captureLocation()">📍 Capture current pickup location</button> <span id="locationStatus" class="small text-secondary">Allow location permission in your browser.</span></div><div class="col-12"><button class="btn btn-success btn-lg">Publish donation</button> <a class="btn btn-light btn-lg" href="/restaurant">Cancel</a></div></div></form></main><script th:src="@{/js/app.js}"></script><script>const e=document.getElementById('expiresAt');if(e){const d=new Date(Date.now()+4*60*60*1000);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());e.min=d.toISOString().slice(0,16);e.value=e.min;}</script></body></html>
