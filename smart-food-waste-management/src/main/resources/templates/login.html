<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | FoodBridge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="auth-wrap"><form class="auth-card" th:action="@{/login}" method="post"><div class="text-center mb-4"><div class="brand-icon">🍲</div><h1 class="h3 fw-bold">Welcome back</h1><p class="text-secondary">Sign in to your FoodBridge account</p></div><div th:if="${param.error}" class="alert alert-danger">Invalid email or password, or your account is disabled.</div><div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div><label class="form-label">Email</label><input type="email" name="username" class="form-control mb-3" required autofocus><label class="form-label">Password</label><input type="password" name="password" class="form-control mb-3" required><button class="btn btn-success w-100 btn-lg">Login</button><p class="text-center mt-3 mb-0">New here? <a href="/register">Create account</a></p></form></main></body></html>
