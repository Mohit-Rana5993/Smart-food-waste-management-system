<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restaurant | FoodBridge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-start flex-wrap gap-3"><div><h1 class="fw-bold">Hello, <span th:text="${user.name}"></span></h1><p class="text-secondary">Make your surplus food count.</p><span class="badge" th:classappend="${user.verificationStatus.name() == 'APPROVED' ? ' text-bg-success' : ' text-bg-warning'}" th:text="'Account: ' + ${user.verificationStatus}"></span></div><a class="btn btn-success btn-lg" href="/restaurant/donations/new">+ Post food donation</a></div><div th:if="${user.verificationStatus.name() != 'APPROVED'}" class="alert alert-warning mt-3">Your account is waiting for admin approval. You can explore the dashboard, but posting is disabled.</div><h2 class="h4 fw-bold mt-5">Your donations</h2><div class="row g-3"><div class="col-lg-6" th:each="d : ${donations}"><div class="card p-3 h-100"><div class="d-flex justify-content-between"><h3 class="h5" th:text="${d.foodName}"></h3><span class="badge text-bg-secondary" th:text="${d.status}"></span></div><p class="text-secondary mb-1" th:text="${d.quantity} + ' ' + ${d.unit} + ' · ' + ${d.foodType}"></p><p class="mb-1" th:text="${d.pickupAddress}"></p><small class="text-secondary" th:text="'Expires: ' + ${d.expiresAt}"></small><a class="mt-2" th:if="${d.latitude != null and d.longitude != null}" target="_blank" th:href="@{'https://www.google.com/maps/dir/?api=1&destination=' + ${d.latitude} + ',' + ${d.longitude}}">Open pickup directions ↗</a><hr><h4 class="h6">Claim requests</h4><div th:each="c : ${claims}" th:if="${c.donation.id == d.id}" class="border rounded p-2 mb-2"><div class="d-flex justify-content-between"><strong th:text="${c.ngo.name}"></strong><span class="badge text-bg-info" th:text="${c.status}"></span></div><small th:text="${c.ngo.email}"></small><div th:if="${c.status.name() == 'REQUESTED'}" class="d-flex gap-2 mt-2"><form th:action="@{'/restaurant/claims/' + ${c.id} + '/decision'}" method="post"><button class="btn btn-sm btn-success" name="decision" value="approve">Approve</button></form><form th:action="@{'/restaurant/claims/' + ${c.id} + '/decision'}" method="post"><button class="btn btn-sm btn-outline-danger" name="decision" value="reject">Reject</button></form></div><form th:if="${c.status.name() == 'PICKED_UP'}" th:action="@{'/restaurant/claims/' + ${c.id} + '/complete'}" method="post" class="mt-2"><button class="btn btn-sm btn-success">Confirm handover complete</button></form></div></div></div><div th:if="${#lists.isEmpty(donations)}" class="empty-state">No donations yet. Post your first surplus-food listing.</div></div></main></body></html>
