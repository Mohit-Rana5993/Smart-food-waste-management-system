<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | FoodBridge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="container py-4"><form class="form-card" th:action="@{'/register/' + ${rolePath}}" method="post" enctype="multipart/form-data"><h1 class="h3 fw-bold" th:text="'Register as ' + ${roleName}"></h1><p class="text-secondary">Your account will be reviewed by an admin before posting or claiming food.</p><div class="row g-3"><div class="col-md-6"><label class="form-label">Organization / restaurant name *</label><input class="form-control" name="name" required maxlength="120"></div><div class="col-md-6"><label class="form-label">Contact email *</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label class="form-label">Password * (minimum 8 characters)</label><input class="form-control" name="password" type="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" maxlength="20"></div><div class="col-md-6"><label class="form-label">Registration / FSSAI number</label><input class="form-control" name="registrationNumber"></div><div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city"></div><div class="col-md-6"><label class="form-label">State</label><input class="form-control" name="state"></div><div class="col-md-6"><label class="form-label">Pincode</label><input class="form-control" name="pincode"></div><div class="col-12"><label class="form-label">Full address</label><input class="form-control" name="address"></div><div class="col-md-6"><label class="form-label">Organization photo (JPG/PNG, max 5 MB)</label><input class="form-control" name="photo" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="col-md-6"><label class="form-label">Verification document (PDF/image, max 5 MB)</label><input class="form-control" name="document" type="file" accept="application/pdf,image/png,image/jpeg,image/webp"></div><div class="col-12"><input type="hidden" name="latitude" id="latitude"><input type="hidden" name="longitude" id="longitude"><button type="button" class="btn btn-outline-success" onclick="captureLocation()">📍 Capture current location</button> <span id="locationStatus" class="small text-secondary">Optional but useful for nearby matching.</span></div><div class="col-12"><button class="btn btn-success btn-lg">Submit registration</button> <a class="btn btn-light btn-lg" href="/register">Cancel</a></div></div></form></main><script th:src="@{/js/app.js}"></script></body></html>
