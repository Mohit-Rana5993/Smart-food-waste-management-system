<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Dashboard | FoodBridge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="container py-4"><div class="d-flex justify-content-between flex-wrap"><div><h1 class="fw-bold">Admin dashboard</h1><p class="text-secondary">Review organizations and monitor food rescue activity.</p></div><span class="badge text-bg-dark align-self-start">ADMIN</span></div><div class="row g-3 mb-5"><div class="col-6 col-lg-3"><div class="stat-card"><small>Restaurants</small><div th:text="${restaurantCount}"></div></div></div><div class="col-6 col-lg-3"><div class="stat-card"><small>NGOs</small><div th:text="${ngoCount}"></div></div></div><div class="col-6 col-lg-3"><div class="stat-card"><small>Donations</small><div th:text="${donationCount}"></div></div></div><div class="col-6 col-lg-3"><div class="stat-card"><small>Completed pickups</small><div th:text="${completedCount}"></div></div></div></div><h2 class="h4 fw-bold">Pending verification</h2><div class="table-responsive card p-3 mb-5"><table class="table align-middle"><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>City</th><th>Document</th><th>Action</th></tr></thead><tbody><tr th:each="u : ${pendingUsers}"><td th:text="${u.name}"></td><td th:text="${u.role}"></td><td th:text="${u.email}"></td><td th:text="${u.city}"></td><td><a th:if="${u.documentPath != null}" th:href="@{'/uploads/' + ${u.documentPath}}" target="_blank">Open file</a><span th:if="${u.documentPath == null}">Not provided</span></td><td><form th:action="@{'/admin/users/' + ${u.id} + '/verify'}" method="post" class="d-flex gap-2"><button class="btn btn-sm btn-success" name="status" value="APPROVED">Approve</button><button class="btn btn-sm btn-outline-danger" name="status" value="REJECTED">Reject</button></form></td></tr><tr th:if="${#lists.isEmpty(pendingUsers)}"><td colspan="6" class="text-center text-secondary">No pending accounts.</td></tr></tbody></table></div><h2 class="h4 fw-bold">All donations</h2><div class="table-responsive card p-3"><table class="table align-middle"><thead><tr><th>Food</th><th>Restaurant</th><th>Quantity</th><th>Status</th><th>Expires</th></tr></thead><tbody><tr th:each="d : ${donations}"><td th:text="${d.foodName}"></td><td th:text="${d.restaurant.name}"></td><td th:text="${d.quantity} + ' ' + ${d.unit}"></td><td><span class="badge text-bg-secondary" th:text="${d.status}"></span></td><td th:text="${d.expiresAt}"></td></tr></tbody></table></div></main></body></html>
